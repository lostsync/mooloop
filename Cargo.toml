[workspace]
resolver = "2"
members = [
    "crates/mooloop-core",
    "crates/mooloop-dsp",
    "crates/mooloop-engine",
    "crates/mooloop-project",
    "crates/mooloop-ui",
    "crates/mooloop-app",
    "spikes/time-stretch",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["adam"]
publish = false

[workspace.dependencies]
mooloop-core = { path = "crates/mooloop-core" }
mooloop-dsp = { path = "crates/mooloop-dsp" }
mooloop-engine = { path = "crates/mooloop-engine" }
mooloop-project = { path = "crates/mooloop-project" }
mooloop-ui = { path = "crates/mooloop-ui" }

slint = "1.17"
slint-build = "1.17"
jack = "0.13"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
debug = true

# Dev debug info is capped workspace-wide, not just on our own crates. A
# per-package override only thins that package's own code; every dependency
# rlib linked into a binary still carried full DWARF, which is why a single
# mooloop-ui test binary reached ~450 MB. Seven of those link during
# `cargo test -p mooloop-ui`, and the concurrent link peak was enough to
# stall a 16 GB workstation into swap.
#
# `line-tables-only` keeps file names and line numbers in panics and
# backtraces, which is what this project actually reads; it gives up variable
# inspection under a debugger. `unpacked` then leaves that debug info in the
# object files instead of copying it into every linked binary.
[profile.dev]
# The ordinary `cargo run` path is used to play the instrument. Leaving its
# per-sample audio code completely unoptimized makes even small songs miss
# JACK deadlines, so keep a modest optimization level without turning every
# edit into a release build.
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

# `mooloop-ui` is the slowest crate in the workspace to rebuild by a wide
# margin: `build.rs` compiles `ui/main.slint`, which transitively imports every
# device face, control, and dialog, so Slint hands rustc one enormous generated
# module and any `.slint` edit regenerates all of it. Optimizing that glue buys
# nothing -- the deadline-sensitive per-sample code lives in `mooloop-dsp` and
# `mooloop-engine`, which keep the profile's `opt-level = 1` above. Turning it
# off here is purely an edit-loop win.
[profile.dev.package.mooloop-ui]
opt-level = 0
