[build]
# This T14 has 4 physical cores/8 threads and 16 GiB RAM, and what exhausts it
# is concurrent *linking*, not compilation. `cargo test -p mooloop-ui` produces
# seven binaries; each is ~217 MB even with dev debug info capped (measured,
# down from ~450 MB before the cap), because most of that bulk is Slint's
# generated code rather than DWARF.
#
# Eight jobs hard-locked the desktop. So did six. So did four, while the
# binaries were still 450 MB. Three is the first setting that has held with
# roughly 10 GB still available throughout, so it is the default; drop to
# `-j 2` explicitly for a full `--workspace` run.
#
# This cap only helps commands that link. `cargo check` never links, and its
# cost is one rustc process on Slint's generated module -- 3.4 GB after an
# edit, 5.2 GB cold -- which no job count subdivides. Run Cargo through
# `scripts/cargo-capped` to bound that; see docs/AGENT_OPERATIONS.md.
jobs = 3
# Keep build output portable across usernames and workstations. Cargo's TOML
# configuration does not expand shell variables such as ${USER}; its default
# workspace-local `target/` directory does. A workstation that needs a shared
# cache across worktrees can set CARGO_TARGET_DIR in its machine-local shell
# configuration. Cargo commands must remain sequential as required by AGENTS.md.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
