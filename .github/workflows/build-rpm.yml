name: Build RPM
run-name: Build RPM (${{ inputs.request_id || github.sha }})

# Produces an optimized RPM on demand without creating a tag or GitHub Release.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifier used by the local download helper.
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  # The committed local config pins maintainer-specific flags and a target dir.
  RUSTFLAGS: ""
  CARGO_TARGET_DIR: target

# Build against glibc 2.31 (Ubuntu 20.04), not the version supplied by the
# ubuntu-latest runner. See release.yml for the supported libc baseline.
defaults:
  run:
    shell: sh

jobs:
  package-rpm:
    name: Build optimized RPM
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            binutils \
            pkg-config \
            libjack-jackd2-dev \
            libasound2-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libfontconfig1-dev \
            rpm

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: rpm

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      # x86-64-v2, as release.yml builds it (MOO-263; packaging/README.md).
      # This replaces the empty workflow RUSTFLAGS, and so the committed
      # config's mold flag, which the runner cannot use anyway.
      - name: Build release binary
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: cargo build --locked --release -p mooloop-app --bin mooloop

      # Baseline holds 3 round instructions, v2 1,423 (MOO-263; release.yml).
      - name: The binary was built for x86-64-v2
        run: |
          set -eu
          count=$(objdump -d --no-show-raw-insn target/release/mooloop | grep -cE '\sround(ss|sd|ps|pd)\s' || true)
          echo "SSE4.1 round instructions: $count"
          if [ "$count" -lt 100 ]; then
            echo "The binary has only $count SSE4.1 round instructions: it was not built with target-cpu=x86-64-v2." >&2
            exit 1
          fi

      # Everything, as release.yml does; this build publishes no symbols.
      - name: Strip the distributable binary
        run: strip --strip-all target/release/mooloop

      - name: Verify glibc compatibility baseline
        run: |
          if readelf -W --version-info target/release/mooloop | \
            awk '/Name: GLIBC_/ { split($3, version, "_"); split(version[2], parts, "."); if (parts[1] > 2 || (parts[1] == 2 && parts[2] > 31)) exit 1 }'; then
            echo "Binary requires glibc 2.31 or older."
          else
            echo "Binary requires glibc newer than 2.31." >&2
            exit 1
          fi

      - name: Package RPM
        run: cargo generate-rpm -p crates/mooloop-app

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: mooloop-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
