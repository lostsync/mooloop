name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml in this repo pins `-fuse-ld=mold` for the maintainer's
  # own machine. mold isn't installed on CI runners, so clear RUSTFLAGS here
  # rather than editing that file — an explicit RUSTFLAGS env var takes
  # precedence over the config file's target.*.rustflags.
  RUSTFLAGS: ""
  # Bypass the maintainer-local absolute target directory in .cargo/config.toml.
  CARGO_TARGET_DIR: target

jobs:
  build:
    name: Check, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libjack-jackd2-dev \
            libasound2-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libfontconfig1-dev

      # The toolchain rust-toolchain.toml pins, clippy included.
      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --locked --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Why the test build is two steps (MOO-141). `mooloop-ui`'s library and
      # its unit-test harness are two rustc processes, and each one compiles
      # the ~395k lines Slint generates from ui/main.slint. Cold, each peaks
      # at 9 to 12 GB. Cargo starts both at once, and their summed peak was
      # 19 GB and 22 GB in two runs (measured on the build box, 2026-09-23,
      # with this job's RUSTFLAGS and -j3 from .cargo/config.toml). This
      # runner has 16 GB. When the two peaks overlapped, the machine ran out
      # and the runner was shut down mid-compile: "Process completed with
      # exit code 143", after minutes with no output. It was intermittent
      # because the overlap was.
      #
      # So the unit-test harnesses are built first. `--workspace --lib`
      # resolves features exactly as the step after it does, so the harness
      # it builds is the one that step reuses. (`-p mooloop-ui --lib` would
      # resolve them differently, and the ui harness would be built twice
      # and overlap anyway, which was measured too.) Measured this way, the
      # harness step peaked at 12 GB alone and the rest at 7 GB.
      - name: cargo test (build the unit-test harnesses first)
        run: cargo test --locked --workspace --lib --no-run

      - name: cargo test
        run: cargo test --locked --workspace

  macos:
    name: Check, clippy, test (macOS)
    # The Core Audio driver compiles only here. Without this job a change that
    # breaks it stays green until somebody next builds on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain rust-toolchain.toml pins, clippy included.
      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --locked --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The same split as the Linux job, and for the same reason. The macOS
      # runner has 7 GB and doesn't die: it swaps, which is likely part of
      # why this job takes over an hour. Two ~10 GB compiles one after the
      # other swap less than two at once.
      - name: cargo test (build the unit-test harnesses first)
        run: cargo test --locked --workspace --lib --no-run

      - name: cargo test
        run: cargo test --locked --workspace
