name: Release

# Builds Linux packages (.deb, .rpm, AppImage) and an unsigned Apple Silicon
# macOS app (zipped .app) and attaches them to a GitHub Release. Fires on a
# `v*.*.*` tag push, or manually via workflow_dispatch for a dry run (no tag
# needed; the publish job still requires a real tag).
#
# The shape, and why (MOO-141):
#
# - `verify` runs first and everything else needs it: the tag matches the
#   workspace version, clippy and the tests pass, and `engine-selftest` plays
#   through a real JACK server (`jackd -d dummy`). A tag whose tests fail
#   publishes nothing.
# - `package-linux` compiles `mooloop` **once** and packages that one binary
#   into the .deb, the .rpm and the AppImage, then checks what each package
#   holds against it. Three jobs used to compile three binaries.
# - The binary ships with `--strip-all`; its symbols are published beside it
#   as `mooloop-<version>-x86_64.debug`, which the binary names in its
#   `.gnu_debuglink`, so a backtrace from a user's crash report can still be
#   symbolised.
# - `publish` adds SHA256SUMS, uses CHANGELOG.md's section for the version
#   as the release text (`scripts/release-notes --changelog`; `verify` fails
#   first if it is missing or still "unreleased"), and attaches the full
#   commit list since the previous tag (`scripts/release-notes <tag>`).
#
# Everything is pinned: the toolchain by rust-toolchain.toml (installed by
# `.github/actions/setup-rust`), dependencies by `--locked`, and linuxdeploy
# by release tag rather than its moving `continuous`.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # See ci.yml: this repo's committed .cargo/config.toml pins a linker and
  # target-dir from the maintainer's own machine. Clear RUSTFLAGS so CI uses
  # the default linker instead.
  RUSTFLAGS: ""
  # Keep package artifacts in the runner workspace, not the maintainer's path.
  CARGO_TARGET_DIR: target
  # A release of linuxdeploy, not its moving `continuous` tag, which made the
  # same commit package differently from one week to the next.
  LINUXDEPLOY_TAG: 1-alpha-20251107-1

jobs:
  verify:
    name: Verify (version, clippy, tests, engine self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the workspace version $VERSION (Cargo.toml)." >&2
            exit 1
          fi

      # The release text is CHANGELOG.md's section for this version (MOO-265).
      # Checked here, before half an hour of building, as well as in
      # `publish`: no section, or a heading that still says "unreleased",
      # stops the release with the script's own message.
      - name: CHANGELOG.md has a dated section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-notes --changelog "$GITHUB_REF_NAME" > /dev/null

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pkg-config \
            jackd2 \
            libjack-jackd2-dev \
            libasound2-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libfontconfig1-dev

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Two steps, not one, so `mooloop-ui`'s library and its unit-test
      # harness never compile at once. Each peaks at 9 to 12 GB and the
      # runner has 16 GB, and the pair together is what killed dry run
      # 35873627542 with exit code 143 (MOO-141). The reasoning and the
      # measurement are in ci.yml, beside the same two steps.
      - name: cargo test (build the unit-test harnesses first)
        run: cargo test --locked --workspace --lib --no-run

      - name: cargo test
        run: cargo test --locked --workspace

      # The one check that runs the real driver: the engine opens a JACK
      # client, renders, and a kick reaches its output port. The dummy
      # backend needs no sound card.
      - name: engine-selftest on jackd -d dummy
        run: |
          cargo build --locked --bin engine-selftest
          jackd --no-realtime -d dummy -r 48000 -p 256 &
          JACKD=$!
          sleep 3
          status=0
          timeout 60 target/debug/engine-selftest || status=$?
          kill "$JACKD" || true
          exit "$status"

  package-linux:
    name: Build once, package .deb, .rpm and AppImage
    needs: verify
    runs-on: ubuntu-latest
    # Built against glibc 2.31 (Ubuntu 20.04), rather than the moving glibc
    # on ubuntu-latest, so the binary runs on Ubuntu 20.04+, Debian 11+ and
    # Fedora 32+ (given their shared-library packages).
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            binutils \
            file \
            pkg-config \
            rpm \
            cpio \
            libjack-jackd2-dev \
            libasound2-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libfontconfig1-dev

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install --locked cargo-deb cargo-generate-rpm

      # x86-64-v2 (SSE4.2, POPCNT), Adam's ruling of 2026-09-25 on MOO-263:
      # without SSE4.1, `floor`, `trunc`, `fract` and `rem_euclid` are libm
      # calls in every per-sample loop; with it they are one `roundss`. Only
      # this binary gets it. `verify` above, ci.yml and every dev build stay
      # at baseline x86-64, so a test cannot lean on an instruction the
      # baseline lacks. Setting RUSTFLAGS here replaces the empty workflow
      # value, and with it .cargo/config.toml's mold flag, which the runner
      # has no mold for anyway. packaging/README.md has the ruling.
      - name: Build the release binary
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: |
          set -euo pipefail
          cargo build --locked --release -p mooloop-app --bin mooloop
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Measured on the build box (MOO-263): a baseline `mooloop` holds 3
      # SSE4.1 round instructions (source untraced; likely a dependency's
      # runtime-dispatched SIMD path),
      # a v2 one 1,423. Under 100 means the flag above was lost.
      - name: The binary was built for x86-64-v2
        run: |
          set -euo pipefail
          count=$(objdump -d --no-show-raw-insn target/release/mooloop | grep -cE '\sround(ss|sd|ps|pd)\s' || true)
          echo "SSE4.1 round instructions: $count"
          if [ "$count" -lt 100 ]; then
            echo "The release binary has only $count SSE4.1 round instructions: it was not built with target-cpu=x86-64-v2." >&2
            exit 1
          fi

      - name: Verify glibc compatibility baseline
        run: |
          if readelf -W --version-info target/release/mooloop | \
            awk '/Name: GLIBC_/ { split($3, version, "_"); split(version[2], parts, "."); if (parts[1] > 2 || (parts[1] == 2 && parts[2] > 31)) exit 1 }'; then
            echo "Binary requires glibc 2.31 or older."
          else
            echo "Binary requires glibc newer than 2.31." >&2
            exit 1
          fi

      # `debug = true` in [profile.release] keeps full symbols for exactly
      # this: they are split off into their own file, and the shipped binary
      # is stripped of everything (--strip-debug left the symbol tables in,
      # about a third of the file).
      - name: Split off the symbols and strip the binary
        run: |
          set -euo pipefail
          mkdir -p dist
          DEBUG="mooloop-${VERSION}-x86_64.debug"
          objcopy --only-keep-debug target/release/mooloop "dist/$DEBUG"
          strip --strip-all target/release/mooloop
          (cd dist && objcopy --add-gnu-debuglink="$DEBUG" ../target/release/mooloop)
          ls -l target/release/mooloop "dist/$DEBUG"

      # `--no-strip`, and linuxdeploy's NO_STRIP below: the binary is already
      # stripped, and a packager that stripped it again would make the
      # packages' binaries differ.
      - name: Package .deb
        run: cargo deb -p mooloop-app --no-build --no-strip --output dist/

      - name: Package .rpm
        run: cargo generate-rpm -p crates/mooloop-app --output dist/

      - name: Package AppImage
        env:
          NO_STRIP: "1"
        run: |
          set -euo pipefail
          curl -fsSL -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/metainfo
          cp target/release/mooloop AppDir/usr/bin/
          cp packaging/io.github.lostsync.mooloop.metainfo.xml AppDir/usr/share/metainfo/
          ./linuxdeploy.AppImage \
            --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/mooloop \
            --desktop-file packaging/mooloop.desktop \
            --icon-file packaging/mooloop.png \
            --output appimage
          mv Mooloop-*.AppImage "dist/Mooloop-${VERSION}-x86_64.AppImage"

      # The point of building once: fail here, not in a user's bug report,
      # if a package carries a binary other than the one just built. The deb
      # and the rpm hold it byte for byte. linuxdeploy sets an RPATH on the
      # AppImage's copy so it finds the libraries bundled beside it, which
      # rewrites the dynamic section, so there the compiled code and data are
      # compared instead.
      - name: Every package carries the binary that was built
        run: |
          set -euo pipefail
          built=target/release/mooloop
          same_file() {
            if ! cmp -s "$built" "$2"; then
              echo "The $1 carries a different mooloop from the one built." >&2
              exit 1
            fi
            echo "$1: identical ($(sha256sum "$2" | cut -d' ' -f1))"
          }
          sections() {
            for section in .text .rodata .data.rel.ro; do
              objcopy -O binary --only-section="$section" "$1" /dev/stdout
            done | sha256sum | cut -d' ' -f1
          }
          mkdir -p unpack/deb unpack/rpm unpack/appimage
          dpkg-deb -x dist/*.deb unpack/deb
          same_file deb unpack/deb/usr/bin/mooloop
          # Focal's rpm2cpio (rpm 4.14) writes a cargo-generate-rpm payload
          # out whole and then exits 1, silently; Fedora's rpm2cpio exits 0
          # and `rpm -K` passes the same file. Its status is not the check:
          # the byte-for-byte compare below is, and a short payload fails it.
          (cd unpack/rpm && { rpm2cpio ../../dist/*.rpm || true; } | cpio -idm --quiet)
          same_file rpm unpack/rpm/usr/bin/mooloop
          (cd unpack/appimage && "../../dist/Mooloop-${VERSION}-x86_64.AppImage" --appimage-extract >/dev/null)
          in_appimage=unpack/appimage/squashfs-root/usr/bin/mooloop
          if [ "$(sections "$built")" != "$(sections "$in_appimage")" ]; then
            echo "The AppImage carries different code from the binary built." >&2
            exit 1
          fi
          echo "AppImage: same code and data as the binary built"

      - uses: actions/upload-artifact@v4
        with:
          name: mooloop-linux
          path: dist/*
          if-no-files-found: error

  # An unsigned Apple Silicon .app, zipped. Ad-hoc signed only: signing and
  # notarization are out of scope (SCOPE.md §4), so Gatekeeper asks once on
  # first open. Intel is not built: cross-compiling mp3lame-sys's autoconf
  # build to x86_64 is untested.
  package-macos:
    name: Build macOS app
    needs: verify
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Build release binary
        run: cargo build --locked --release -p mooloop-app --bin mooloop

      - name: Assemble Mooloop.app
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          APP=Mooloop.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/mooloop "$APP/Contents/MacOS/mooloop"
          strip -S "$APP/Contents/MacOS/mooloop"

          ICONSET=mooloop.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" packaging/mooloop.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" packaging/mooloop.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/mooloop.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Mooloop</string>
            <key>CFBundleDisplayName</key><string>Mooloop</string>
            <key>CFBundleIdentifier</key><string>io.github.lostsync.mooloop</string>
            <key>CFBundleExecutable</key><string>mooloop</string>
            <key>CFBundleIconFile</key><string>mooloop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>Mooloop records audio from the input you choose.</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"

          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/mooloop"

          ditto -c -k --keepParent "$APP" "Mooloop-${VERSION}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mooloop-macos
          path: Mooloop-*-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package-linux, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and every tag: the changelog is the commits since
      # the previous release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Changelog and checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The curated section is the release text; the full commit list
          # since the previous tag rides along as its own asset.
          scripts/release-notes --changelog "$GITHUB_REF_NAME" > "dist/mooloop-${VERSION}-CHANGELOG.md"
          scripts/release-notes "$GITHUB_REF_NAME" > "dist/mooloop-${VERSION}-commits.md"
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            cat "dist/mooloop-${VERSION}-CHANGELOG.md"
            echo
            echo '## SHA-256'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > release-notes.md
          cat dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-notes.md
