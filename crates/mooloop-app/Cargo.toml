[package]
name = "mooloop-app"
description = "Experimental, Linux-native, tracker-inspired pattern instrument"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mooloop"
path = "src/main.rs"

[features]
# Forwarded to `mooloop-ui`; see its manifest and `docs/OPERATIONS.md`.
mcp = ["mooloop-ui/mcp"]

[dependencies]
mooloop-core = { workspace = true }
mooloop-dsp = { workspace = true }
mooloop-engine = { workspace = true }
mooloop-ui = { workspace = true }
# The plugin scanner: `mooloop --scan-plugin <path>` is its child, and the
# startup scan is its parent (MOO-80). The child is this same binary, so every
# package below ships it with nothing added.
mooloop-plugin-host = { workspace = true }

[dev-dependencies]
# `tests/scan_child.rs` scans the test plugin with the real `mooloop` binary;
# naming it here is what makes cargo build its cdylib next to the test.
mooloop-test-plugin = { path = "../mooloop-test-plugin" }
tempfile = "3"

# Packaged by .github/workflows/release.yml via `cargo deb`. $auto finds the
# shared libraries the binary links (fontconfig, ALSA, ...), and only those.
# Two kinds of dependency it cannot see are named by hand, here and in the
# rpm's requires below:
#
# - zenity is not a library: every file dialog and confirmation shells out to
#   it (`mooloop-session/src/dialogs.rs`), and without it Open, Save and
#   Export have no way to ask for a path.
# - Libraries loaded with dlopen at run time: libjack (the `jack` crate's
#   dynamic loading; PipeWire's JACK layer provides one too), EGL and GL for
#   Slint's renderer, and xkbcommon, Wayland and the X11 client libraries for
#   winit. Without them the app opens with no audio, or not at all, and
#   nothing at install time says why (MOO-141).
[package.metadata.deb]
maintainer = "adam <lostsync@gmail.com>"
copyright = "2026, adam"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Mooloop is an experimental, Linux-native, tracker-inspired pattern \
instrument. It combines a channel rack, piano roll, playlist, sampler, and \
small synthesis engines, and talks directly to JACK or PipeWire's JACK \
compatibility layer."""
section = "sound"
priority = "optional"
depends = """$auto, zenity, \
libjack-jackd2-0 | libjack0 | pipewire-jack, \
libegl1, libgl1, libxkbcommon0, libxkbcommon-x11-0, \
libwayland-client0, libwayland-cursor0, libwayland-egl1, \
libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2"""
assets = [
    ["target/release/mooloop", "usr/bin/", "755"],
    ["../../packaging/mooloop.desktop", "usr/share/applications/", "644"],
    ["../../packaging/mooloop.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../packaging/io.github.lostsync.mooloop.metainfo.xml", "usr/share/metainfo/", "644"],
]

# Packaged by .github/workflows/release.yml via `cargo generate-rpm`.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mooloop", dest = "/usr/bin/mooloop", mode = "755" },
    { source = "../../packaging/mooloop.desktop", dest = "/usr/share/applications/mooloop.desktop", mode = "644" },
    { source = "../../packaging/mooloop.png", dest = "/usr/share/icons/hicolor/256x256/apps/mooloop.png", mode = "644" },
    { source = "../../packaging/io.github.lostsync.mooloop.metainfo.xml", dest = "/usr/share/metainfo/io.github.lostsync.mooloop.metainfo.xml", mode = "644" },
]

# Linked libraries are found by generate-rpm's automatic requires; zenity and
# the dlopen'd libraries are not (see the deb metadata above). Named by
# soname, so either JACK or PipeWire's JACK layer satisfies libjack.
[package.metadata.generate-rpm.requires]
zenity = "*"
"libjack.so.0()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-cursor.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrandr.so.2()(64bit)" = "*"
