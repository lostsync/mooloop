[package]
name = "mooloop-test-plugin"
description = "The in-repo CLAP test double every plugin-hosting step runs against. Not shipped."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
# `cdylib` is the plugin: `mooloop-plugin-host`'s tests load it by path, the
# way they would load any `.clap` file. `rlib` is there only so the host crate
# can name this one as a dev-dependency, which is what makes cargo build the
# cdylib before those tests run. The cargo feature that would hand a test the
# cdylib's path directly (artifact dependencies, `CARGO_CDYLIB_FILE_*`) is
# nightly-only.
crate-type = ["cdylib", "rlib"]

# CLAP stays inside the plugin-host crates (`docs/plans/plugin-hosting/`,
# "No format type leaves `crates/mooloop-plugin-host`"), so the versions are
# spelled here rather than in the workspace table.
[dependencies]
clack-plugin = "0.2"
clack-extensions = { version = "0.2", features = [
    "clack-plugin",
    "audio-ports",
    "gui",
    "latency",
    "log",
    "note-ports",
    "params",
    "state",
    "tail",
    "thread-check",
] }
