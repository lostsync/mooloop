[package]
name = "mooloop-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mooloop-core = { workspace = true }
mooloop-dsp = { workspace = true }
rtrb = { workspace = true }
arc-swap = "1"
hound = "3"
mp3lame-encoder = "0.2.4"

[features]
# Test support, not API: `live_check::play_through_executor`, the executor
# with no driver, for a check outside this crate that holds an export against
# playback (MOO-82). Only examples and tests enable it.
test-support = []

# The platform picks the audio driver at compile time: JACK, and pipewire-jack
# behind it, everywhere but macOS; Core Audio through cpal on macOS, with MIDI
# input from Core MIDI through midir. JACK carries its own MIDI.
[target.'cfg(not(target_os = "macos"))'.dependencies]
jack = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { workspace = true }
midir = { workspace = true }

# Only to ask the callback thread whether the realtime scheduling its driver
# requested on its behalf was actually granted: `sched_getscheduler` on Linux,
# the Mach time-constraint policy on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The container tests render a project, save it, reload it and render it
# again; the claim is that the document round trip preserves a nesting the
# engine can hear, which needs both halves in one test. `mooloop-project`
# depends only on `mooloop-core`, so this is a dev-only leaf rather than a
# cycle.
mooloop-project = { workspace = true }
# A hosted CLAP effect in the engine (`src/plugin_host_tests.rs`, MOO-81):
# the host crate's adapter over the in-repo test plugin. Naming the test
# plugin is what makes cargo build its cdylib next to the test binary, where
# the tests load it by path. The host crate depends on core and dsp only, so
# neither is a cycle.
mooloop-plugin-host = { workspace = true }
mooloop-test-plugin = { path = "../mooloop-test-plugin" }
tempfile = "3"
toml = { workspace = true }
