[package]
name = "mooloop-session"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Deliberately no `slint`. This crate is the live application model, and the
# compiler is what keeps a view type from leaking into it -- see
# `docs/plans/session-layer-extraction/00-status.md`.
[dependencies]
mooloop-core = { workspace = true }
mooloop-dsp = { workspace = true }
mooloop-engine = { workspace = true }
mooloop-project = { workspace = true }
hound = "3"
rtrb = { workspace = true }
symphonia = {
    version = "0.6.1",
    default-features = false,
    features = ["aiff", "flac", "mp3", "ogg", "opt-simd", "pcm", "vorbis", "wav"]
}
# Moving an unused take to the desktop trash rather than deleting it
# (`audio-recording/06`): the one case the scan cannot tell apart from an
# unused take is a crash leftover, where being wrong costs a recording.
trash = "5"

# The desktop's file chooser portal (`dialogs.rs`, MOO-90), spoken over
# D-Bus. Already in the tree through the window system's accessibility
# layer, which is why this is zbus rather than `rfd` or `ashpd`: no new
# crate, only the blocking half of one already built.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Free space on the disk a take is armed on (MOO-75): `statvfs`, safely.
# Already in the tree through `tempfile`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
