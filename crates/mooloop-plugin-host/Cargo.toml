[package]
name = "mooloop-plugin-host"
description = "Loads and runs third-party plugins. No plugin format's types leave this crate."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# It must not depend on `mooloop-ui` or `mooloop-session`: the session will
# depend on this crate (`docs/plans/plugin-hosting/04-the-plugin-rack.md`),
# not the other way round.
[dependencies]
mooloop-core = { workspace = true }
mooloop-dsp = { workspace = true }
# The scanner (`src/scan.rs`, MOO-80): the child's JSON report and the TOML
# cache.
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# The bounded ring a hosted plugin's own parameter changes travel back to the
# control thread in (`src/clap.rs`): pushed on the audio thread, never grown.
rtrb = { workspace = true }
clack-host = "0.2"
clack-extensions = { version = "0.2", features = [
    "clack-host",
    "audio-ports",
    "gui",
    "latency",
    "log",
    "note-ports",
    "params",
    "state",
    "tail",
    "thread-check",
] }

# The scan child the scanner's own tests launch (`tests/scan.rs`). The app
# launches itself instead (`mooloop --scan-plugin`), so this binary is never
# packaged; it exists because a test in this crate cannot launch `mooloop`.
[[bin]]
name = "mooloop-scan-child"
path = "src/bin/mooloop-scan-child.rs"

[dev-dependencies]
# Named only so cargo builds the test plugin's cdylib before this crate's
# tests run; the tests load it by path and never link it. See that crate's
# `[lib]` table.
mooloop-test-plugin = { path = "../mooloop-test-plugin" }
tempfile = "3"
