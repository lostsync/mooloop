[package]
name = "mooloop-plugin-window"
description = "The OS windows a hosted plugin's GUI goes into, and which display server mooloop runs on."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Platform & Release's (`docs/TEAMS.md`), plugin-hosting step 11, MOO-301.
# Kept out of `mooloop-ui` so it builds and tests in seconds rather than
# behind a Slint build, and so it needs no window to test: nothing here opens
# a display unless a test that is `#[ignore]`d asks it to.
[dependencies]
# The neutral types the window is handed to the plugin in (`NativeWindow`,
# `GuiSize`). No plugin format's types: this crate never names `clack-*`.
mooloop-plugin-host = { workspace = true }
mooloop-core = { workspace = true }
# What Slint's `raw-window-handle-06` feature hands out, read here to tell
# X11 from Wayland from AppKit and to find the main window's native id.
# Re-exported, so the UI names the same version Slint implements.
raw-window-handle = "0.6"

# The X11 window, everywhere but macOS. Already in the lock through winit.
# The core protocol is all a bare window needs, and the pure-Rust connection
# needs no libxcb. `resource_manager` reads `Xft.dpi` the way winit does;
# winit enables it already.
[target.'cfg(not(target_os = "macos"))'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["resource_manager"] }

# The Cocoa window on macOS: the `objc2` 0.6 family `mooloop-engine`'s
# CoreAudio bindings already lock, with only the AppKit classes a panel and
# its delegate need, so nothing new enters the lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

# `tests/cocoa_window.rs` makes the application object a bare test binary
# lacks.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }

# A Cocoa window can only be made on the main thread, which libtest never
# runs a test on, so this test has a `main` of its own.
[[test]]
name = "cocoa_window"
harness = false
