[package]
name = "mooloop-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mooloop-core = { workspace = true }
mooloop-dsp = { workspace = true }
mooloop-engine = { workspace = true }
slint = { workspace = true }
hound = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
tempfile = "3"
i-slint-backend-testing = { version = "1.17", features = ["renderer-software"] }
