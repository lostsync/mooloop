[package]
name = "mooloop-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Compiles Slint's embedded MCP server into the binary and makes `build.rs`
# emit element debug info, so an agent can inspect and drive the running
# application. Off by default and never enabled by a release build; see
# `docs/OPERATIONS.md`.
mcp = ["slint/mcp"]

# Compiles the drag-and-drop UI mockup tool: its Slint module, its Rust wiring,
# and the Developer preferences entry that opens it. Off by default, because
# everything one `.slint` entry point reaches expands into a single generated
# Rust module -- exporting the tool from `main.slint` put 1.78 MB of generated
# Rust, 4.3% of the module, into every build including release. See
# `docs/plans/edit-loop/01-the-verification-ladder.md`.
mockup = []

[dependencies]
mooloop-core = { workspace = true }
mooloop-dsp = { workspace = true }
mooloop-engine = { workspace = true }
# The browser's PLUGINS tab reads the scanner's cache (MOO-83). Only its
# neutral types: `tests/plugin_formats_stay_out.rs` holds this crate to it.
mooloop-plugin-host = { workspace = true }
mooloop-project = { workspace = true }
mooloop-session = { workspace = true }
slint = { workspace = true }
symphonia = {
    version = "0.6.1",
    default-features = false,
    features = ["aiff", "flac", "mp3", "ogg", "opt-simd", "pcm", "vorbis", "wav"]
}
serde = { workspace = true }
toml = { workspace = true }

# SIGTERM, SIGINT and SIGHUP routed to the quit path (`src/signals.rs`).
# Already in the lock through `mooloop-engine`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The standalone tool cannot build without the module it is a front end for.
[[example]]
name = "mockup"
required-features = ["mockup"]

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
hound = "3"
tempfile = "3"
i-slint-backend-testing = { version = "1.17", features = ["renderer-software"] }
# The all-faces test walks the item tree for the `slider` role, which needs
# `ItemRc`; the search API that would hide it needs element debug info CI
# does not build. Already in the graph through `slint`, at the same version.
i-slint-core = "=1.17.1"
# The plugin browser's window test puts the in-repo CLAP test double in a
# chain; naming it here is what makes cargo build its cdylib first.
mooloop-test-plugin = { path = "../mooloop-test-plugin" }
